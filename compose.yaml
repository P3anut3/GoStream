name: gostream-dev

services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gostream
      MYSQL_USER: gostream
      MYSQL_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:?Run scripts/init-compose-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_ROOT_PASSWORD:?Run scripts/init-compose-env.ps1 first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${COMPOSE_MYSQL_PORT:-13307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1 FROM users LIMIT 0"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${COMPOSE_REDIS_PASSWORD:?Run scripts/init-compose-env.ps1 first}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:${COMPOSE_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${COMPOSE_RABBITMQ_USER:-gostream}
      RABBITMQ_DEFAULT_PASS: ${COMPOSE_RABBITMQ_PASSWORD:?Run scripts/init-compose-env.ps1 first}
    ports:
      - "127.0.0.1:${COMPOSE_AMQP_PORT:-15673}:5672"
      - "127.0.0.1:${COMPOSE_RABBITMQ_UI_PORT:-15674}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

  api:
    image: gostream-api:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      GOSTREAM_DSN: "gostream:${COMPOSE_MYSQL_PASSWORD:?Run scripts/init-compose-env.ps1 first}@tcp(mysql:3306)/gostream?charset=utf8mb4&parseTime=true&loc=Local"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-compose-env.ps1 first}
      GOSTREAM_FEED_CURSOR_SECRET: ${GOSTREAM_FEED_CURSOR_SECRET:?Run scripts/init-compose-env.ps1 first}
      GOSTREAM_REDIS_ADDR: redis:6379
      GOSTREAM_REDIS_PASSWORD: ${COMPOSE_REDIS_PASSWORD:?Run scripts/init-compose-env.ps1 first}
      GOSTREAM_HTTP_ADDR: 0.0.0.0:8080
      GOSTREAM_VIDEO_DIR: /app/uploads/videos
      GOSTREAM_COVER_DIR: /app/uploads/covers
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-19080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      # Redis is only a cache: it orders startup, but the API keeps serving from MySQL if it fails later.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
